<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Pulse · Controls: actions and fields</title>
<!-- Moss reference mockup for Team Pulse. Static design reference only, not app code. All people and notes are fictional. Canvas size 1280 x 840. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:-apple-system, BlinkMacSystemFont, 'Instrument Sans', 'Helvetica Neue', sans-serif;color:#1D1D1F;background:#F5F5F7}
a{color:#0066CC}a:hover{color:#0051A3}
input::placeholder,textarea::placeholder{color:#6E6E73;opacity:1}
</style>
</head>
<body>
<div style="width: 1280px; height: 840px; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 34px; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'Instrument Sans', 'Helvetica Neue', sans-serif">
<section style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<h2 style="margin: 0; font-size: 16px; line-height: 1.25; font-weight: 600; color: #1D1D1F">Buttons</h2>
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 22px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px"><button type="button" style="appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; box-sizing: border-box; margin: 0; padding: 0 14px; flex-shrink: 0; background: #0066CC; border: 1px solid #0066CC; border-radius: 999px; font-family: inherit; font-size: 13.5px; font-weight: 600; color: #FFFFFF; white-space: nowrap; cursor: pointer">Save goal</button><span style="font-size: 11.5px; font-weight: 500; color: #636366">Primary</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px"><button type="button" style="appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; box-sizing: border-box; margin: 0; padding: 0 14px; flex-shrink: 0; background: #E8E8ED; border: 1px solid transparent; border-radius: 999px; font-family: inherit; font-size: 13.5px; font-weight: 500; color: #1D1D1F; white-space: nowrap; cursor: pointer">Cancel</button><span style="font-size: 11.5px; font-weight: 500; color: #636366">Secondary</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px"><button type="button" style="appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; box-sizing: border-box; margin: 0; padding: 0 14px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #D60015; border-radius: 999px; font-family: inherit; font-size: 13.5px; font-weight: 600; color: #D60015; white-space: nowrap; cursor: pointer">Remove goal</button><span style="font-size: 11.5px; font-weight: 500; color: #636366">Danger</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px"><button type="button" style="appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 28px; box-sizing: border-box; margin: 0; padding: 0 10px; flex-shrink: 0; background: #E8E8ED; border: 1px solid transparent; border-radius: 999px; font-family: inherit; font-size: 12.5px; font-weight: 500; color: #1D1D1F; white-space: nowrap; cursor: pointer">1:1 room</button><span style="font-size: 11.5px; font-weight: 500; color: #636366">Small</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px"><span style="display: flex; align-items: center; height: 36px"><button type="button" style="appearance: none; margin: 0; padding: 0; flex-shrink: 0; background: transparent; border: 0; font-family: inherit; font-size: 13px; font-weight: 600; color: #0066CC; white-space: nowrap; cursor: pointer">View all →</button></span><span style="font-size: 11.5px; font-weight: 500; color: #636366">Link</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px"><span style="display: flex; align-items: center; height: 36px"><button type="button" aria-label="Remove talking point" style="appearance: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; box-sizing: border-box; margin: 0; padding: 0; flex-shrink: 0; background: transparent; border: 0; border-radius: 999px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span><span style="font-size: 11.5px; font-weight: 500; color: #636366">Icon</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px"><button type="button" disabled style="appearance: none; display: inline-flex; align-items: center; justify-content: center; height: 36px; box-sizing: border-box; margin: 0; padding: 0 14px; flex-shrink: 0; background: #EDEDF0; border: 1px solid #EDEDF0; border-radius: 999px; font-family: inherit; font-size: 13.5px; font-weight: 500; color: #8E8E93; white-space: nowrap; cursor: not-allowed">Insert talking points</button><span style="font-size: 11.5px; font-weight: 500; color: #636366">Disabled</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px"><button type="button" style="appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; box-sizing: border-box; margin: 0; padding: 0 14px; flex-shrink: 0; background: #0066CC; border: 1px solid #0066CC; border-radius: 999px; font-family: inherit; font-size: 13.5px; font-weight: 600; color: #FFFFFF; white-space: nowrap; cursor: pointer; outline: 2px solid #0066CC; outline-offset: 2px">Wrap up meeting</button><span style="font-size: 11.5px; font-weight: 500; color: #636366">Keyboard focus</span></div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<h2 style="margin: 0; font-size: 16px; line-height: 1.25; font-weight: 600; color: #1D1D1F">Header</h2>
<div style="display: flex; align-items: flex-start; gap: 40px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px"><button type="button" style="appearance: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; box-sizing: border-box; margin: 0; padding: 0 8px 0 12px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #D2D2D7; border-radius: 999px; font-family: inherit; font-size: 13.5px; font-weight: 500; color: #1D1D1F; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg><span>Search</span><kbd style="display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border: 1px solid #E3E3E8; border-radius: 5px; background: #F5F5F7; font-family: inherit; font-size: 11.5px; font-weight: 500; color: #636366">/</kbd></button><span style="font-size: 11.5px; font-weight: 500; color: #636366">Search, opens with /</span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; height: 36px"><span role="status" style="display: inline-flex; align-items: center; gap: 7px; height: 28px; box-sizing: border-box; padding: 0 10px; flex-shrink: 0; border-radius: 999px; background: #E2F3EA; border: 1px solid #E2F3EA; font-size: 12.5px; font-weight: 600; color: #1A6644; white-space: nowrap"><span aria-hidden="true" style="display: block; width: 7px; height: 7px; border-radius: 50%; background: #1B8561"></span>Autosaved</span><span role="status" style="display: inline-flex; align-items: center; gap: 7px; height: 28px; box-sizing: border-box; padding: 0 10px; flex-shrink: 0; border-radius: 999px; background: #EDEDF0; border: 1px solid #EDEDF0; font-size: 12.5px; font-weight: 600; color: #515154; white-space: nowrap"><span aria-hidden="true" style="display: block; width: 7px; height: 7px; border-radius: 50%; background: #636366"></span>Saving…</span><span role="status" style="display: inline-flex; align-items: center; gap: 7px; height: 28px; box-sizing: border-box; padding: 0 10px; flex-shrink: 0; border-radius: 999px; background: #FFF0DB; border: 1px solid #FFF0DB; font-size: 12.5px; font-weight: 600; color: #8A4B00; white-space: nowrap"><span aria-hidden="true" style="display: block; width: 7px; height: 7px; border-radius: 50%; background: #C7750A"></span>Pending save</span><span role="status" style="display: inline-flex; align-items: center; gap: 7px; height: 28px; box-sizing: border-box; padding: 0 10px; flex-shrink: 0; border-radius: 999px; background: #FDE8EA; border: 1px solid #FDE8EA; font-size: 12.5px; font-weight: 600; color: #B0000F; white-space: nowrap"><span aria-hidden="true" style="display: block; width: 7px; height: 7px; border-radius: 50%; background: #D60015"></span>Save failed</span><span role="status" style="display: inline-flex; align-items: center; gap: 7px; height: 28px; box-sizing: border-box; padding: 0 10px; flex-shrink: 0; border-radius: 999px; background: transparent; border: 1px solid #C7C7CC; font-size: 12.5px; font-weight: 600; color: #515154; white-space: nowrap"><span aria-hidden="true" style="display: block; width: 7px; height: 7px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #86868B"></span>No folder connected</span></div>
<span style="font-size: 11.5px; font-weight: 500; color: #636366">Save status</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px"><button type="button" aria-haspopup="menu" aria-expanded="true" style="appearance: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; box-sizing: border-box; margin: 0; padding: 0 10px 0 12px; flex-shrink: 0; background: #EDEDF0; border: 1px solid #D2D2D7; border-radius: 999px; font-family: inherit; font-size: 13.5px; font-weight: 500; color: #1D1D1F; cursor: pointer">Data<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button><div role="menu" aria-label="Data actions" style="display: flex; flex-direction: column; gap: 2px; width: 196px; box-sizing: border-box; padding: 6px; background: rgba(255, 255, 255, 0.88); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(0, 0, 0, 0.06); border-radius: 12px; box-shadow: 0 24px 56px -12px rgba(0, 0, 0, 0.24), 0 0 0 0.5px rgba(0, 0, 0, 0.10)"><button type="button" role="menuitem" style="appearance: none; display: flex; align-items: center; width: 100%; height: 34px; box-sizing: border-box; margin: 0; padding: 0 10px; background: transparent; border: 0; border-radius: 6px; font-family: inherit; font-size: 13.5px; color: #1D1D1F; text-align: left; cursor: pointer">Choose folder</button><button type="button" role="menuitem" style="appearance: none; display: flex; align-items: center; width: 100%; height: 34px; box-sizing: border-box; margin: 0; padding: 0 10px; background: #EDEDF0; border: 0; border-radius: 6px; font-family: inherit; font-size: 13.5px; color: #1D1D1F; text-align: left; cursor: pointer">Import JSON</button><button type="button" role="menuitem" style="appearance: none; display: flex; align-items: center; width: 100%; height: 34px; box-sizing: border-box; margin: 0; padding: 0 10px; background: transparent; border: 0; border-radius: 6px; font-family: inherit; font-size: 13.5px; color: #1D1D1F; text-align: left; cursor: pointer">Import .ics</button><button type="button" role="menuitem" style="appearance: none; display: flex; align-items: center; width: 100%; height: 34px; box-sizing: border-box; margin: 0; padding: 0 10px; background: transparent; border: 0; border-radius: 6px; font-family: inherit; font-size: 13.5px; color: #1D1D1F; text-align: left; cursor: pointer">Export files</button></div></div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<h2 style="margin: 0; font-size: 16px; line-height: 1.25; font-weight: 600; color: #1D1D1F">Fields</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 20px">
<label style="display: flex; flex-direction: column; gap: 6px; min-width: 0; grid-column: span 2"><span style="font-size: 12.5px; font-weight: 500; color: #636366">Goal title *</span><input type="text" placeholder="e.g. Lead a validation deliverable end to end" style="appearance: none; width: 100%; box-sizing: border-box; margin: 0; background: #FFFFFF; border: 1px solid #86868B; border-radius: 10px; font-family: inherit; font-size: 14px; color: #1D1D1F; height: 38px; padding: 0 12px; font-size: 14px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 12.5px; font-weight: 500; color: #636366">Status</span><span style="position: relative; display: flex; min-width: 0"><select style="appearance: none; width: 100%; box-sizing: border-box; margin: 0; background: #FFFFFF; border: 1px solid #86868B; border-radius: 10px; font-family: inherit; font-size: 14px; color: #1D1D1F; height: 38px; padding: 0 34px 0 12px; cursor: pointer"><option selected>On track</option><option>At risk</option><option>Paused</option><option>Done</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 11px; top: 50%; margin-top: -8px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg></span></label>
<label style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 12.5px; font-weight: 500; color: #636366">Target date (optional)</span><input type="date" value="2026-11-30" style="appearance: none; width: 100%; box-sizing: border-box; margin: 0; background: #FFFFFF; border: 1px solid #86868B; border-radius: 10px; font-family: inherit; font-size: 14px; color: #1D1D1F; height: 38px; padding: 0 12px; font-size: 14px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 12.5px; font-weight: 500; color: #636366">1:1 overdue after</span><span style="display: flex; align-items: center; height: 38px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #86868B; border-radius: 10px; overflow: hidden"><input type="number" min="1" value="14" style="appearance: none; flex-grow: 1; min-width: 0; height: 36px; box-sizing: border-box; margin: 0; padding: 0 12px; background: transparent; border: 0; font-family: inherit; font-size: 14px; color: #1D1D1F; font-variant-numeric: tabular-nums"><span style="display: flex; align-items: center; height: 36px; padding: 0 12px; background: #F5F5F7; border-left: 1px solid #E3E3E8; font-size: 13px; color: #636366">days</span></span></label>
<label style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 12.5px; font-weight: 500; color: #636366">Progress</span><span style="display: flex; align-items: center; gap: 12px; height: 38px"><input type="range" min="0" max="100" step="5" value="40" style="flex-grow: 1; min-width: 0; margin: 0; accent-color: #0066CC"><span style="width: 38px; font-size: 14px; font-weight: 500; color: #1D1D1F; text-align: right; font-variant-numeric: tabular-nums">40%</span></span></label>
<label style="display: flex; flex-direction: column; gap: 6px; min-width: 0; grid-column: span 2"><span style="font-size: 12.5px; font-weight: 500; color: #636366">Detail (optional)</span><textarea placeholder="What good looks like, how it will be assessed" style="appearance: none; width: 100%; box-sizing: border-box; margin: 0; background: #FFFFFF; border: 1px solid #86868B; border-radius: 10px; font-family: inherit; font-size: 14px; color: #1D1D1F; display: block; height: 84px; padding: 10px 12px; font-size: 14px; line-height: 1.55; resize: vertical"></textarea></label>
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><label style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 12.5px; font-weight: 500; color: #636366">Progress note (optional)</span><input type="text" placeholder="Short dated note added to the goal's progress log" style="appearance: none; width: 100%; box-sizing: border-box; margin: 0; background: #FFFFFF; border: 1px solid #86868B; border-radius: 10px; font-family: inherit; font-size: 14px; color: #1D1D1F; height: 38px; padding: 0 12px; font-size: 14px; border-color: #0066CC; box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.22)"></label><span style="font-size: 11.5px; font-weight: 500; color: #636366">Keyboard focus</span></div>
</div>
</section>
</div>
</body>
</html>
